[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqst"
version = "0.1.0"
description = "Lightweight Python inference library and CLI for Squeal Studio models from Hugging Face"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Squeal Studio" }
]
keywords = [
    "nlp",
    "llm",
    "inference",
    "squeal-studio",
    "qwen2",
    "drakon",
    "lstm",
    "text-generation",
    "russian"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "packaging>=21.0",
    "numpy>=1.20.0",
    "click>=8.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.15.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
sqst = "sqst.cli:main"

[project.urls]
Homepage = "https://squealstudio.ru"
Repository = "https://github.com/Squeal-Studio/sqst"
"Hugging Face" = "https://huggingface.co/Squeal-Studio"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
